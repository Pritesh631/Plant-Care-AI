services:
  - type: web
    name: plantcare-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && python backend/download_model.py
    startCommand: PYTHONPATH=backend gunicorn "app:create_app()" --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: ../models/plant_disease_model.keras
      - key: CLASS_NAMES_PATH
        value: ../models/class_names.json
      - key: CORS_ORIGINS
        value: https://elegant-strudel-20c743.netlify.app
      - key: MAX_UPLOAD_MB
        value: "5"
